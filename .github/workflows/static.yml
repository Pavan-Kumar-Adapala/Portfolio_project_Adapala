# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"] # Change this to your default branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # This step is used to display the VM information
      # and the GitHub Actions environment variables
      # - name: Display VM Information
      #   id: vm-info
      #   run: |
      #     echo "##[group]VM Information"
      #     echo "Operating System: $(uname -a)"
      #     echo "GitHub Runner: $RUNNER_NAME"
      #     echo "Runner OS: $RUNNER_OS"
      #     echo "Runner Architecture: $RUNNER_ARCH"
      #     echo "Runner Temp Path: $RUNNER_TEMP"
      #     echo "Runner Workspace Path: $RUNNER_WORKSPACE"
      #     echo "GitHub Workspace: $GITHUB_WORKSPACE"
      #     echo "GitHub Repository: $GITHUB_REPOSITORY"
      #     echo "GitHub Ref: $GITHUB_REF"
      #     echo "GitHub SHA: $GITHUB_SHA"
      #     echo "Processor Info:"
      #     lscpu
      #     echo "Memory Info:"
      #     free -h
      #     echo "Disk Space Info:"
      #     df -h
      #     echo "##[endgroup]"
      #     echo "##[group]GitHub Actions Environment Variables"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the contents of the public directory
          # to the GitHub Pages artifact
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  
  # Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      # This step is used to display the VM information
      # and the GitHub Actions environment variables
      # - name: Display VM Information Used  for Docker Build and Push
      #   id: vm-info
      #   run: |
      #     echo "##[group]VM Information"
      #     echo "Operating System: $(uname -a)"
      #     echo "GitHub Runner: $RUNNER_NAME"
      #     echo "Runner OS: $RUNNER_OS"
      #     echo "Runner Architecture: $RUNNER_ARCH"
      #     echo "Runner Temp Path: $RUNNER_TEMP"
      #     echo "Runner Workspace Path: $RUNNER_WORKSPACE"
      #     echo "GitHub Workspace: $GITHUB_WORKSPACE"
      #     echo "GitHub Repository: $GITHUB_REPOSITORY"
      #     echo "GitHub Ref: $GITHUB_REF"
      #     echo "GitHub SHA: $GITHUB_SHA"
      #     echo "Processor Info:"
      #     lscpu
      #     echo "Memory Info:"
      #     free -h
      #     echo "Disk Space Info:"
      #     df -h
      #     echo "##[endgroup]"
      #     echo "##[group]GitHub Actions Environment Variables"

      - name: Checkout
        uses: actions/checkout@v4

      # Set up QEMU to enable multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      # Set up Docker Buildx to enable advanced build capabilities like multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false
      
      # Build and push the Docker image
      # This step builds the Docker image and pushes it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/portfolio:latest

      # clean up old images
      - name: Remove old images
        run: |
          # List  and delete images older than specific tags (Keep last 5 tags)
          # The `docker images` command lists all images
          # The `--format` option is used to specify the output format
          # The `grep` command filters the images to only include those that match the specified repository
          # The `tail -n +6` command skips the first 5 lines of output
          # The `xargs` command is used to pass the filtered image names to the `docker rmi` command
          # The `docker rmi` command is used to remove the specified images
          # The `-f` option forces the removal of the images
          # The `-I` option is used to specify a placeholder for the image name
   
          docker images --format "{{.Repository}}:{{.Tag}}" | \
          grep "${{ secrets.DOCKER_USERNAME }}/portfolio" | \
          tail -n +6 | \
          xargs -I docker rmi -f {}

      # Logout from Docker Hub to ensure security and clean up the session
      - name: Logout from Docker Hub
        run: |
          docker logout
          echo "Logged out from Docker Hub"
